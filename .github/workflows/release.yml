name: Release

# 打 tag(如 v0.2.0)即三平台打包并发布 GitHub Release;
# 手动触发只构建并上传工作流产物,不建 Release。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "20"

jobs:
  build:
    name: 打包 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact_path: src-tauri/target/release/bundle/nsis/*
          - os: ubuntu-latest
            bundles: deb
            artifact_path: src-tauri/target/release/bundle/deb/*.deb
          - os: macos-latest
            bundles: dmg
            artifact_path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
    steps:
      - uses: actions/checkout@v4

      - name: 校验应用版本一致
        shell: bash
        run: |
          package_ver="$(node -p "require('./package.json').version")"
          tauri_ver="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_ver="$(awk -F'"' '/^version = "/ { print $2; exit }' src-tauri/Cargo.toml)"
          if [ "$package_ver" != "$tauri_ver" ] || [ "$package_ver" != "$cargo_ver" ]; then
            echo "::error::版本不一致: package.json=$package_ver, tauri.conf.json=$tauri_ver, Cargo.toml=$cargo_ver"
            exit 1
          fi

      - name: 校验 tag 与应用版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag 与 package.json 版本 $ver 不一致"
            exit 1
          fi

      - name: Linux 系统依赖 (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: Tauri 打包
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kvba-${{ matrix.os }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
